# Full stack: SQL Server + ASP.NET Core API + React (nginx)
#   docker compose up --build
#   App:     http://localhost:3000
#   Swagger: http://localhost:8080/swagger
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: taskmanager-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:-YourStrong!Passw0rd}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build: ./backend
    container_name: taskmanager-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=TaskManagerDb;User Id=sa;Password=${SA_PASSWORD:-YourStrong!Passw0rd};TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY:-docker_compose_demo_secret_key_change_me_please_123}
      Jwt__ExpiryMinutes: "60"
      Cors__Origins__0: http://localhost:3000
      Swagger__Enabled: "true"
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: taskmanager-frontend
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  sqldata:
